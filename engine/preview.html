<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asset Preview</title>
  <style>
    :root { --fg: #f5efe6; --muted: #b9b0a3; --panel: rgba(18,16,14,.86); --line: rgba(255,255,255,.14); --accent: #e8a33d; font-family: system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1816; color: var(--fg); }
    #view { display: block; width: 100vw; height: 100vh; }
    #panel { position: fixed; left: 16px; top: 16px; width: 280px; max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 13px; }
    #panel h1 { font-size: 16px; margin: 0 0 4px; }
    #panel p { color: var(--muted); margin: 0 0 10px; line-height: 1.4; }
    #panel label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; }
    #panel input, #panel select { width: 120px; background: #2a2724; color: var(--fg); border: 1px solid #4a453f; border-radius: 6px; padding: 3px 6px; }
    #panel input[type=checkbox] { width: auto; }
    #panel .hint { margin-top: 10px; color: var(--muted); font-size: 12px; }
    #panel code { color: var(--accent); }
    @media (max-width: 600px) { #panel { width: calc(100vw - 32px); max-height: 40vh; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel"></div>
  <script type="module" src="/src/preview.ts"></script>
</body>
</html>
